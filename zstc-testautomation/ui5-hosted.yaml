# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
# Build of the hosted mockup (npm run build:hosted): the app plus the SAPUI5 libraries it needs, as preload bundles.
specVersion: "4.0"
metadata:
  name: zstc.testautomation
type: application
framework:
  name: SAPUI5
  version: "1.136.22"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.fe.templates
    - name: sap.suite.ui.commons
    - name: sap.ui.export
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - "/localService/**"
      - "/test/**"
