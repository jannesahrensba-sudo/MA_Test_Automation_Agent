#XTIT: Section title of the process steps
processTitle=How It Works
processDescribe=1 Describe
processDescribeText=Describe the scenario in your own words and choose Analyze, or enter the test data directly per business object.
processValidate=2 Validate
processValidateText=Deterministic check against master data and the field requirements of the process profile, with a traffic light and suggestions per field.
processApprove=3 Approve
processApproveText=Human in the loop: only valid test cases can be approved.
processExecute=4 Execute
processExecuteText=The execution provider runs the path of the process variant up to the selected end object, e.g. service request → quotation → order → confirmation → billing (mock).
#XTIT: process overview step 6
processRelease=6 Release
#XMSG: process overview step 6 text
processReleaseText=Process teams assign their processes to releases (SAP feature package stacks or internal releases); the regression run executes all approved test cases of the scope and shows coverage and results per team, process and process step.
processVerify=5 Verify
processVerifyText=Expected values are compared with the created documents: final result, document flow and assertions.

