processTitle=How It Works
processDescribe=1 Describe
processDescribeText=Describe the scenario in your own words and choose Analyze, or enter the test data directly per business object.
processValidate=2 Validate
processValidateText=Deterministic check against master data and the field requirements of the process profile, with a traffic light and suggestions per field.
processApprove=3 Approve
processApproveText=Human in the loop: only valid test cases can be approved.
