<title>Service-to-Cash Test Automation Assistant</title>
<style>
    /* Hosted mockup: SAP Fiori (sap_horizon) app in a slim shell. Colors come from the SAPUI5 theme; these tokens only
       cover the moment before the theme is loaded. */
    :root {
        --zstc-bg: #f5f6f7;
        --zstc-fg: #1d2d3e;
        --zstc-muted: #556b82;
        --zstc-accent: #0064d9;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --zstc-bg: #12171c; --zstc-fg: #eaecee; --zstc-muted: #a9b4be; --zstc-accent: #4db1ff; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --zstc-bg: #12171c; --zstc-fg: #eaecee; --zstc-muted: #a9b4be; --zstc-accent: #4db1ff; color-scheme: dark; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--zstc-bg); color: var(--zstc-fg); overflow: hidden; }
    #zstc-root { height: 100%; display: flex; flex-direction: column; }
    #zstc-shell { flex: none; }
    #zstc-app { flex: 1 1 auto; min-height: 0; position: relative; }
    #zstc-loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 0.75rem; text-align: center; padding-inline: 16px; font: 0.875rem/1.4 system-ui, sans-serif; color: var(--zstc-muted); }
    #zstc-loading strong { color: var(--zstc-fg); font-size: 1rem; }
    #zstc-loading .bar { width: min(16rem, 70vw); height: 0.25rem; margin-inline: auto; border-radius: 0.125rem; background: color-mix(in srgb, var(--zstc-accent) 20%, transparent); overflow: hidden; }
    #zstc-loading .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--zstc-accent); animation: zstc-load 1.2s ease-in-out infinite; }
    @keyframes zstc-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #zstc-loading .bar::after { animation: none; width: 100%; } }
</style>
<div id="zstc-root">
    <div id="zstc-shell"></div>
    <div id="zstc-app">
        <div id="zstc-loading" role="status">
            <strong>Service-to-Cash Test Automation Assistant</strong>
            <span>Loading SAPUI5 1.136 and the mock OData service…</span>
            <div class="bar"></div>
        </div>
    </div>
</div>
<script src="boot.js"></script>
<script src="mockserver.js"></script>
<script id="sap-ui-bootstrap" src="resources/sap-ui-core.js"></script>
<script src="resources/zstc-i18n-preload.js"></script>
